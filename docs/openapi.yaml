  /api/applications/{application_id}/submit:
    post:
      description: 'Отправка DRAFT → SUBMITTED, 202: конвейер запустится асинхронно позднее. expected_revision
        обязателен. Idempotency-Key — UUID, генерирует клиент для одной попытки. Область ключа (пользователь,
        заявка, submit), хранение минимум 24 часа; тот же ключ + тот же JSON-запрос возвращает исходный
        202 и снимок ответа без новой отправки (проверка повтора до ревизии); тот же ключ + другой запрос
        — 409; другой ключ при устаревшей ревизии/не-DRAFT — 409. Проверка и запись атомарны. Проверяются
        компания, активный продукт, цель, положительные сумма/срок и согласие. Выручка необязательна.
        Снимок входов, аудит, задание и ответ сохраняются одной транзакцией. В B06 заявка остаётся SUBMITTED
        до подключения worker B07.'
      operationId: submit_application_api_applications__application_id__submit_post
      parameters:
      - in: path
        name: application_id
        required: true
        schema:
          examples:
          - 10000000-0000-4000-8000-000000000001
          format: uuid
          title: Application Id
          type: string
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          examples:
          - 70000000-0000-4000-8000-000000000001
          format: uuid
          title: Idempotency-Key
          type: string
      requestBody:
        content:
          application/json:
            examples:
              submit:
                summary: 'Синтетический пример: submit'
                value:
