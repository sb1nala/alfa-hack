    CSRFToken:
      description: GET /api/auth/csrf; токен в памяти; X-CSRF-Token при мутациях.
      in: header
      name: X-CSRF-Token
      type: apiKey
    SessionCookie:
      description: JWT в HttpOnly cookie; сервер проверяет подпись HS256 и сессию.
      in: cookie
      name: access_token
      type: apiKey
info:
  description: '

    API v1: авторизация JWT, роли, владение ресурсами, Origin и CSRF реализованы.

    Каталог продуктов, поиск компании через локальный мок ЕГРЮЛ, создание, список,

    чтение и редактирование черновиков, submit и cancel работают с PostgreSQL.

    Submit атомарно сохраняет аудит, снимок входов, задание и идемпотентный ответ.

    В B06 заявка остаётся SUBMITTED: worker и кредитные решения — следующие этапы.

    Остальные бизнес-операции остаются заглушками и после проверок доступа возвращают 501.


    Один настроенный origin для фронтенда и API. JWT только в cookie `access_token`

    (HttpOnly; Secure в HTTPS; SameSite=Lax; Path=/), никогда в JSON или localStorage.

    GET /api/auth/csrf доступен до входа: создаёт анонимный контекст `csrf_context`

    в HttpOnly cookie с теми же атрибутами и возвращает csrf_token. Клиент хранит токен

    в памяти и передаёт X-CSRF-Token во всех изменяющих запросах, включая login/logout.

    Origin обязателен и должен точно совпадать с AUTH_ALLOWED_ORIGIN. Токен связан с

    серверным контекстом и сессией. При входе/выходе контекст ротируется, затем клиент

    снова вызывает GET /api/auth/csrf; повторный GET сохраняет действующий токен.

    Logout отзывает сессию в PostgreSQL, в том числе для скопированного JWT.

    Auth-ответы имеют Cache-Control: no-store. Чужой ресурс — 404, неверная роль/CSRF

    или Origin — 403, отсутствующая/просроченная/отозванная сессия — 401.


    UUID для идентификаторов, ISO 8601 UTC для времени, суммы — десятичные строки

    рублей с двумя знаками, сроки — целые месяцы. `revision` начинается с 1;

    каждая мутация заявки, включая загрузку документа, повышает её ревизию.

    `expected_revision` проверяется атомарно; устаревшая ревизия и недопустимый статус —

    409. После загрузки документа перечитать карточку для актуальной ревизии.

    Ошибки: `code`, `message`, `field_errors` (пустой список вне валидации), `request_id`.

    `X-Request-ID` ответа соответствует UUID в ошибке; секреты и входные значения

    в ошибках не возвращаются. Клиент ориентируется на code, не на текст message.


    Статусы/переходы — docs/application-states.md. Отмена разрешена из активных

    состояний до SIGNED, исключая конечные REJECTED, ISSUED, CANCELLED. Submit и cancel реализованы.

    allowed_actions — подсказка интерфейсу; сервис обязан

    проверять права, статус и ревизию при выполнении операции.


    Все примеры синтетические. Кредитные условия импортируются из справочника рисков;

    публичный каталог не раскрывает внутренний снимок политики.

    '
  title: Умный кредитный кабинет предпринимателя
  version: 0.2.0
openapi: 3.1.0
paths:
  /api/applications:
    get:
      description: Список только собственных заявок. Сортировка updated_at DESC, id DESC. offset/limit
        — пагинация; status — необязательный фильтр.
      operationId: list_applications_api_applications_get
      parameters:
      - in: query
        name: status
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/ApplicationStatus'
          - type: 'null'
          title: Status
      - in: query
        name: offset
        required: false
        schema:
          default: 0
          minimum: 0
          title: Offset
          type: integer
      - in: query
        name: limit
        required: false
        schema:
          default: 20
          maximum: 100
          minimum: 1
          title: Limit
          type: integer
      responses:
        '200':
          content:
            application/json:
              examples:
                applications:
                  summary: 'Синтетический пример: applications'
                  value:
                    items:
                    - allowed_actions:
                      - edit
                      - submit
                      - cancel
                      - upload_document
                      amount: '100000.00'
                      company_name: ООО «Синтетический пример»
                      created_at: '2026-10-20T18:00:00Z'
                      id: 10000000-0000-4000-8000-000000000001
                      product_id: 30000000-0000-4000-8000-000000000001
                      revision: 1
                      status: DRAFT
                      term_months: 12
                      updated_at: '2026-10-20T18:00:00Z'
                    limit: 20
                    offset: 0
                    total: 1
              schema:
                $ref: '#/components/schemas/Page_ClientApplicationSummary_'
          description: Успешный ответ
          headers:
            Cache-Control:
              schema:
                const: no-store
                type: string
        '400':
          content:
            application/json:
              examples:
                error:
                  summary: 'Синтетический пример: error'
                  value:
                    code: BAD_REQUEST
                    field_errors: []
                    message: Некорректный запрос
                    request_id: 80000000-0000-4000-8000-000000000001
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Некорректный запрос
          headers:
            Cache-Control:
              schema:
                const: no-store
                type: string
            X-Request-ID:
              schema:
                format: uuid
                type: string
        '401':
          content:
            application/json:
              examples:
                error:
                  summary: 'Синтетический пример: error'
                  value:
                    code: UNAUTHENTICATED
                    field_errors: []
                    message: Требуется вход
                    request_id: 80000000-0000-4000-8000-000000000001
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Требуется вход
          headers:
            Cache-Control:
              schema:
                const: no-store
                type: string
            X-Request-ID:
              schema:
                format: uuid
                type: string
        '403':
          content:
            application/json:
              examples:
                error:
                  summary: 'Синтетический пример: error'
                  value:
                    code: FORBIDDEN
                    field_errors: []
                    message: Недостаточно прав или неверный CSRF-токен
                    request_id: 80000000-0000-4000-8000-000000000001
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Недостаточно прав или неверный CSRF-токен
          headers:
            Cache-Control:
              schema:
                const: no-store
                type: string
            X-Request-ID:
              schema:
                format: uuid
                type: string
        '404':
          content:
            application/json:
              examples:
                error:
                  summary: 'Синтетический пример: error'
                  value:
                    code: NOT_FOUND
                    field_errors: []
                    message: Ресурс не найден или недоступен этому владельцу
                    request_id: 80000000-0000-4000-8000-000000000001
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Ресурс не найден или недоступен этому владельцу
          headers:
            Cache-Control:
              schema:
                const: no-store
                type: string
            X-Request-ID:
              schema:
                format: uuid
                type: string
        '422':
          content:
            application/json:
              examples:
                error:
                  summary: 'Синтетический пример: error'
                  value:
                    code: VALIDATION_ERROR
                    field_errors:
                    - code: greater_than_equal
                      field: body.term_months
                      message: Некорректное значение
                    message: Некорректные параметры запроса
                    request_id: 80000000-0000-4000-8000-000000000001
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Некорректные параметры запроса
          headers:
            Cache-Control:
              schema:
                const: no-store
                type: string
            X-Request-ID:
              schema:
                format: uuid
                type: string
        '429':
          content:
            application/json:
              examples:
                error:
                  summary: 'Синтетический пример: error'
                  value:
                    code: RATE_LIMITED
                    field_errors: []
                    message: Слишком много запросов
                    request_id: 80000000-0000-4000-8000-000000000001
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Слишком много запросов
          headers:
            Cache-Control:
              schema:
                const: no-store
                type: string
            X-Request-ID:
              schema:
                format: uuid
                type: string
        '500':
          content:
            application/json:
              examples:
                error:
                  summary: 'Синтетический пример: error'
                  value:
                    code: INTERNAL_ERROR
                    field_errors: []
                    message: Внутренняя ошибка
                    request_id: 80000000-0000-4000-8000-000000000001
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Внутренняя ошибка
          headers:
            Cache-Control:
              schema:
                const: no-store
                type: string
            X-Request-ID:
              schema:
                format: uuid
                type: string
      security:
      - SessionCookie: []
