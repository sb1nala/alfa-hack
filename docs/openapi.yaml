  /api/applications/{application_id}/events:
    get:
      description: 'Будущий SSE для владельца client или underwriter, стандартный EventSource одного

        origin: `new EventSource(''/api/applications/'' + id + ''/events'')`. Cookie JWT

        передаётся браузером автоматически; заголовок Authorization и CSRF для GET не нужны.

        Сейчас возвращается **501 application/json**, поток не открывается.


        Успешный ответ: `text/event-stream`, UTF-8, Cache-Control: no-cache,

        X-Accel-Buffering: no. Кадр содержит `id: <UUID application_event>`,

        `event: status_changed|application_updated|decision_created|document_uploaded`,

        `data: <одна JSON-строка>` и пустую строку в конце. Схемы data/envelope — SSEEvent

        (расширение x-event-schema). Название event совпадает с data.event_type.

        Heartbeat — комментарий `: heartbeat` и пустая строка каждые ~15 секунд; без id,

        не меняет ревизию и не создаёт событие аудита. `retry: 3000` задаёт задержку

        переподключения браузера, не является бизнес-событием.


        При переподключении EventSource сам передаёт Last-Event-ID. Сервер воспроизводит

        события строго после курсора в порядке записи; возможны повторы, дедупликация по id.

        UUID — непрозрачный курсор, сортировать его лексикографически нельзя. Чужой курсор

        — 404, удалённый из периода хранения — 410; срок хранения согласовать при реализации.

        Без курсора — новые события с момента подключения. На onopen клиент перечитывает

        карточку (в том числе после reconnect), использует revision для защиты от устаревших

        обновлений. При ошибке соединения перечитывает карточку/историю; EventSource

        не предоставляет коду HTTP-статус и не позволяет задавать произвольные заголовки.

        История доступна отдельно через GET /history. События содержат только публичную

        инвалидацию состояния; подробное решение нужно получать из подходящей роли карточки.



        Бизнес-заглушка: 501 после проверок доступа.'
      operationId: events_api_applications__application_id__events_get
      parameters:
      - in: path
        name: application_id
        required: true
        schema:
          examples:
          - 10000000-0000-4000-8000-000000000001
          format: uuid
          title: Application Id
          type: string
      - in: header
        name: Last-Event-ID
        required: false
        schema:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          examples:
          - 70000000-0000-4000-8000-000000000001
          title: Last-Event-Id
      responses:
        '200':
          content:
            text/event-stream:
              examples:
                application_updated:
                  summary: 'Синтетический пример: application_updated'
                  value: 'id: 70000000-0000-4000-8000-000000000002

                    event: application_updated

                    data: {"event_type":"application_updated","application_id":"10000000-0000-4000-8000-000000000001","revision":3,"status":"CHECKING","occurred_at":"2026-10-20T18:00:00Z"}


                    '
                decision_created:
                  summary: 'Синтетический пример: decision_created'
                  value: 'id: 70000000-0000-4000-8000-000000000003

                    event: decision_created

                    data: {"event_type":"decision_created","application_id":"10000000-0000-4000-8000-000000000001","revision":4,"status":"CHECKING","occurred_at":"2026-10-20T18:00:00Z"}


                    '
                document_uploaded:
                  summary: 'Синтетический пример: document_uploaded'
                  value: 'id: 70000000-0000-4000-8000-000000000004

                    event: document_uploaded

                    data: {"event_type":"document_uploaded","application_id":"10000000-0000-4000-8000-000000000001","revision":5,"status":"CHECKING","occurred_at":"2026-10-20T18:00:00Z"}


                    '
                heartbeat:
                  summary: 'Синтетический пример: heartbeat'
                  value: ': heartbeat


                    '
                status_changed:
                  summary: 'Синтетический пример: status_changed'
                  value: 'retry: 3000

