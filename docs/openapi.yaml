components:
  schemas:
    AcceptOfferRequest:
      additionalProperties: false
      properties:
        expected_revision:
          minimum: 1.0
          title: Expected Revision
          type: integer
        offer_id:
          format: uuid
          title: Offer Id
          type: string
      required:
      - expected_revision
      - offer_id
      title: AcceptOfferRequest
      type: object
    AdditionalInfoRequest:
      additionalProperties: false
      properties:
        annual_revenue:
          anyOf:
          - description: Рубли, строка с 2 знаками
            maxLength: 30
            pattern: ^(0|[1-9][0-9]*)\.[0-9]{2}$
            type: string
          - type: 'null'
          title: Annual Revenue
        comment:
          maxLength: 4000
          minLength: 1
          title: Comment
          type: string
        document_ids:
          items:
            format: uuid
            type: string
          title: Document Ids
          type: array
        expected_revision:
          minimum: 1.0
          title: Expected Revision
          type: integer
      required:
      - expected_revision
      - comment
      title: AdditionalInfoRequest
      type: object
    AllowedAction:
      enum:
      - edit
      - submit
      - cancel
      - accept_offer
      - provide_info
      - upload_document
      - sign
      title: AllowedAction
      type: string
    ApplicationEvent:
      additionalProperties: false
      properties:
        application_id:
          format: uuid
          title: Application Id
          type: string
        event_type:
          enum:
          - status_changed
          - application_updated
          - decision_created
          - document_uploaded
          title: Event Type
          type: string
        id:
          description: Непрозрачный курсор SSE, не порядковый номер
          format: uuid
          title: Id
          type: string
        message:
          description: Только публичный текст, без внутренних факторов и снимков моков
          maxLength: 4000
          minLength: 1
          title: Message
          type: string
        occurred_at:
          description: ISO 8601 in UTC
          format: date-time
          pattern: .*(Z|\+00:00)$
          title: Occurred At
          type: string
        previous_status:
          anyOf:
          - $ref: '#/components/schemas/ApplicationStatus'
          - type: 'null'
        revision:
          minimum: 1.0
          title: Revision
          type: integer
        status:
          $ref: '#/components/schemas/ApplicationStatus'
      required:
      - id
      - application_id
      - revision
      - event_type
      - status
      - previous_status
      - occurred_at
      - message
      title: ApplicationEvent
      type: object
    ApplicationStatus:
      enum:
      - DRAFT
      - SUBMITTED
      - CHECKING
      - SCORING
      - NEEDS_INFO
      - MANUAL_REVIEW
      - APPROVED
      - COUNTER_OFFER
      - REJECTED
      - OFFER_ACCEPTED
      - SIGNED
      - ISSUED
      - CANCELLED
      title: ApplicationStatus
      type: string
    ApplicationUpdatedData:
      additionalProperties: false
      properties:
        application_id:
          format: uuid
          title: Application Id
          type: string
        event_type:
          enum:
          - application_updated
          - decision_created
          - document_uploaded
          title: Event Type
          type: string
        occurred_at:
          description: ISO 8601 in UTC
          format: date-time
          pattern: .*(Z|\+00:00)$
          title: Occurred At
          type: string
        revision:
          minimum: 1
          title: Revision
          type: integer
        status:
          $ref: '#/components/schemas/ApplicationStatus'
      required:
      - event_type
      - application_id
      - revision
      - status
      - occurred_at
      title: ApplicationUpdatedData
      type: object
    ApprovedDecision:
      additionalProperties: false
      properties:
        created_at:
          description: ISO 8601 in UTC
          format: date-time
          pattern: .*(Z|\+00:00)$
          title: Created At
          type: string
        explanation:
          description: Клиентское объяснение без факторов и баллов скоринга
          maxLength: 4000
          minLength: 1
          title: Explanation
          type: string
        id:
          format: uuid
          title: Id
          type: string
        offer:
          $ref: '#/components/schemas/Offer'
        outcome:
          const: APPROVED
          title: Outcome
          type: string
        reasons:
          items:
            $ref: '#/components/schemas/Reason'
          title: Reasons
          type: array
        required_documents:
          items:
            $ref: '#/components/schemas/RequiredDocument'
          title: Required Documents
          type: array
      required:
      - id
      - created_at
      - reasons
      - explanation
      - required_documents
      - outcome
      - offer
      title: ApprovedDecision
      type: object
    BankDecision:
      additionalProperties: false
      properties:
        analytical_explanation:
          maxLength: 4000
          minLength: 1
          title: Analytical Explanation
          type: string
        author_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Author Id
        policy_version:
          anyOf:
          - type: string
          - type: 'null'
          title: Policy Version
        public:
          discriminator:
            mapping:
              APPROVED: '#/components/schemas/ApprovedDecision'
              COUNTER_OFFER: '#/components/schemas/CounterOfferDecision'
              MANUAL_REVIEW: '#/components/schemas/ManualReviewDecision'
              NEEDS_INFO: '#/components/schemas/NeedsInfoDecision'
              REJECTED: '#/components/schemas/RejectedDecision'
            propertyName: outcome
          oneOf:
          - $ref: '#/components/schemas/ApprovedDecision'
          - $ref: '#/components/schemas/CounterOfferDecision'
          - $ref: '#/components/schemas/NeedsInfoDecision'
          - $ref: '#/components/schemas/ManualReviewDecision'
          - $ref: '#/components/schemas/RejectedDecision'
          title: Public
        scoring_factors:
          items:
            $ref: '#/components/schemas/ScoringFactor'
          title: Scoring Factors
          type: array
        source:
          enum:
          - automatic
          - underwriter
          title: Source
          type: string
      required:
      - public
      - source
      - author_id
      - policy_version
      - scoring_factors
      - analytical_explanation
      title: BankDecision
      type: object
    Body_upload_document_api_applications__application_id__documents_post:
      properties:
        document_type:
          maxLength: 4000
          minLength: 1
          title: Document Type
          type: string
        expected_revision:
          minimum: 1.0
          title: Expected Revision
          type: integer
        file:
          contentMediaType: application/octet-stream
          description: Бинарное содержимое документа
          title: File
          type: string
      required:
      - file
      - document_type
      - expected_revision
      title: Body_upload_document_api_applications__application_id__documents_post
      type: object
    CSRFResponse:
      additionalProperties: false
      properties:
        csrf_token:
          description: Передавать в X-CSRF-Token; JWT здесь отсутствует
          minLength: 1
          title: Csrf Token
          type: string
      required:
      - csrf_token
      title: CSRFResponse
      type: object
    CancelRequest:
      additionalProperties: false
      properties:
        expected_revision:
          minimum: 1.0
          title: Expected Revision
          type: integer
        reason:
          anyOf:
          - maxLength: 4000
            minLength: 1
            type: string
          - type: 'null'
          title: Reason
      required:
      - expected_revision
      title: CancelRequest
      type: object
    ClientApplication:
      additionalProperties: false
      properties:
        accepted_offer_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Accepted Offer Id
        allowed_actions:
          items:
            $ref: '#/components/schemas/AllowedAction'
          title: Allowed Actions
          type: array
        amount:
          anyOf:
          - description: Положительная сумма в рублях, строка с 2 знаками
            maxLength: 30
            pattern: ^([1-9][0-9]*\.[0-9]{2}|0\.(0[1-9]|[1-9][0-9]))$
            type: string
          - type: 'null'
          title: Amount
        company_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Company Name
        created_at:
          description: ISO 8601 in UTC
          format: date-time
          pattern: .*(Z|\+00:00)$
          title: Created At
          type: string
        decision:
          anyOf:
          - discriminator:
              mapping:
                APPROVED: '#/components/schemas/ApprovedDecision'
                COUNTER_OFFER: '#/components/schemas/CounterOfferDecision'
                MANUAL_REVIEW: '#/components/schemas/ManualReviewDecision'
                NEEDS_INFO: '#/components/schemas/NeedsInfoDecision'
                REJECTED: '#/components/schemas/RejectedDecision'
              propertyName: outcome
            oneOf:
            - $ref: '#/components/schemas/ApprovedDecision'
            - $ref: '#/components/schemas/CounterOfferDecision'
            - $ref: '#/components/schemas/NeedsInfoDecision'
            - $ref: '#/components/schemas/ManualReviewDecision'
            - $ref: '#/components/schemas/RejectedDecision'
          - type: 'null'
          description: Последнее публичное решение либо null
          title: Decision
        form:
          $ref: '#/components/schemas/DraftFields'
        id:
          format: uuid
          title: Id
          type: string
        owner_id:
          format: uuid
          title: Owner Id
          type: string
        product_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Product Id
        revision:
          minimum: 1.0
          title: Revision
          type: integer
        status:
          $ref: '#/components/schemas/ApplicationStatus'
        term_months:
          anyOf:
          - description: Срок в целых месяцах
            minimum: 1.0
            type: integer
          - type: 'null'
          title: Term Months
        updated_at:
          description: ISO 8601 in UTC
          format: date-time
          pattern: .*(Z|\+00:00)$
          title: Updated At
          type: string
      required:
      - id
      - company_name
      - product_id
      - amount
      - term_months
      - status
      - revision
      - allowed_actions
      - created_at
      - updated_at
      - owner_id
      - form
      - decision
      - accepted_offer_id
      title: ClientApplication
      type: object
