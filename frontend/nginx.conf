# Single origin for the SPA and the API: cookies and CSRF stay first-party, no CORS.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;

    # Documents up to 10 MB (docs/product/ui-texts.ru.json, errors.fileTooLarge)
    client_max_body_size 11m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Resolve `backend` through Docker's embedded DNS on every request (cached 10 s), not
    # once at startup: a recreated backend container gets a new IP, and a static
    # upstream would keep answering 502 until this container restarts.
    resolver 127.0.0.11 valid=10s ipv6=off;
    # A stopped backend is unknown to Docker DNS; fail fast instead of waiting for upstream DNS.
    resolver_timeout 1s;

    location /api/ {
        # A variable forces runtime resolution; without a URI part the request
        # path is passed unchanged, exactly as with the static address before.
        set $backend_upstream backend:8000;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE (B09): no buffering, long-lived connection
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # Hashed build assets can be cached forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # SPA: unknown paths are client routes
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "DENY" always;
    }
}
