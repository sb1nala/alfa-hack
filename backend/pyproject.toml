[project]
name = "alfa-hack-backend"
version = "0.1.0"
description = "Infrastructure for the entrepreneur credit cabinet"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.18,<2",
    "argon2-cffi>=25.1,<26",
    "asyncpg>=0.30,<1",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.7,<3",
    "pyjwt>=2.10,<3",
    "python-multipart>=0.0.20,<1",
    "pyyaml>=6,<7",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "jsonschema>=4.23,<5",
    "openapi-spec-validator>=0.7,<0.8",
    "pytest>=8.3,<10",
    "rfc3339-validator>=0.1.4,<1",
    "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
