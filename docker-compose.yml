services:
  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-alfa_hack}
      POSTGRES_USER: ${POSTGRES_USER:-alfa_hack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s

  backend:
    build:
      context: ./backend
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-alfa_hack}
      POSTGRES_USER: ${POSTGRES_USER:-alfa_hack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DB_READINESS_TIMEOUT: ${DB_READINESS_TIMEOUT:-2}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=14)"]
      interval: 5s
      timeout: 15s
      retries: 3
      start_period: 5s

  mocks:
    build:
      context: ./mocks
      additional_contexts:
        seed: ./seed
    environment:
      MOCKS_LATENCY_MS: ${MOCKS_LATENCY_MS:-300}
    ports:
      - "127.0.0.1:${MOCKS_PORT:-8001}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 3s

volumes:
  postgres_data:
